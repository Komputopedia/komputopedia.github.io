<style>
  /* Opening scene: a garden with a flowing river, rainbow and drifting clouds. Shown until the app is ready. */
  #splash { position: fixed; inset: 0; z-index: 50; background: linear-gradient(#bfe3ff 0%, #e6f4ff 55%, #fdf3e1 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .3s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash svg { width: 100%; height: 100%; display: block; }
  #splash .title { position: absolute; left: 0; right: 0; top: 13%; text-align: center; font-family: "Baloo 2", Nunito, system-ui, sans-serif; font-weight: 800; font-size: clamp(34px, 8vw, 64px); color: #1f3b63; text-shadow: 0 2px 12px rgba(255,255,255,.9); opacity: 0; animation: kqFade .45s .1s ease forwards; }
  #splash .title small { display: block; font-family: Nunito, system-ui, sans-serif; font-weight: 700; font-size: clamp(14px, 3vw, 18px); color: #5d7697; }
  #splash .rainbow path { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: kqDraw .7s ease forwards; }
  #splash .rainbow path:nth-child(2) { animation-delay: .05s; } #splash .rainbow path:nth-child(3) { animation-delay: .1s; }
  #splash .rainbow path:nth-child(4) { animation-delay: .15s; } #splash .rainbow path:nth-child(5) { animation-delay: .2s; }
  #splash .cloud { animation: kqDrift 9s linear infinite; }
  #splash .cloud.c2 { animation-duration: 13s; animation-delay: -4s; } #splash .cloud.c3 { animation-duration: 11s; animation-delay: -8s; }
  #splash .shine { stroke-dasharray: 18 26; animation: kqFlow 1.4s linear infinite; }
  #splash .shine.s2 { animation-duration: 1.9s; }
  #splash .bloom { transform-box: fill-box; transform-origin: center; animation: kqBloom 2.4s ease-in-out infinite; }
  #splash .bloom:nth-child(2n) { animation-delay: .6s; } #splash .bloom:nth-child(3n) { animation-delay: 1.2s; }
  @keyframes kqDraw { to { stroke-dashoffset: 0; } }
  @keyframes kqDrift { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
  @keyframes kqFlow { to { stroke-dashoffset: -44; } }
  @keyframes kqBloom { 50% { transform: scale(1.25); } }
  @keyframes kqFade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } #splash .rainbow path { stroke-dashoffset: 0; } #splash .title { opacity: 1; } }
</style>
</head>

    <circle cx="790" cy="170" r="150" fill="url(#sun)"/>

    <path d="M0 520 C150 460 300 470 450 505 C600 540 760 470 1000 495 L1000 700 L0 700 Z" fill="#9fdc9a"/>
    <path d="M0 560 C200 520 360 545 520 570 C700 598 850 540 1000 560 L1000 700 L0 700 Z" fill="#7fcd85"/>

    <g>
      <circle class="bloom" cx="120" cy="600" r="9" fill="#ffb3c9"/><circle class="bloom" cx="180" cy="625" r="7" fill="#fff1a0"/>
      <circle class="bloom" cx="250" cy="595" r="8" fill="#ffffff"/><circle class="bloom" cx="320" cy="640" r="9" fill="#ffd59a"/>

  </svg>

<div id="app"></div>
<noscript>Asha Quest membutuhkan JavaScript.</noscript>
<script>
  // Tap to skip; the app also hides it once it is ready (main.js calls window.kqReady()).
  (function () {
    var start = Date.now(), el = document.getElementById("splash"), done = false;
    function hide() { if (done) return; done = true; el.classList.add("hide"); setTimeout(function () { el.remove(); }, 700); }
    el.addEventListener("click", hide);
    window.kqReady = function () { setTimeout(hide, Math.max(0, 1000 - (Date.now() - start))); };
    setTimeout(hide, 12000); // never block the app for long
  })();
</script>
<script type="module" src="app/main.js?v=202611200626"></script>
